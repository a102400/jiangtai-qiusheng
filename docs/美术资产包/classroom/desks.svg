<?xml version="1.0" encoding="UTF-8"?>
<!--
  讲台求生 · 2D 教室课桌层（desks）
  =================================
  这一层画在「人物之后」，所以课桌前沿会遮住立绘最下面一截 ——
  立绘是半身裁切，原本的平底会显得像被切断，桌子一挡就自然变成
  「学生坐在桌后」。

  本文件是**手绘源文件**：直接改这里，不要用 SVGO 覆盖
        （Inkscape / Figma 可以直接打开本文件继续迭代）。

  坐标系与 backdrop.svg 完全一致（viewBox 0 0 2400 800）：
    桌面可见条  y = 636 ~ 662   (学生身后 → 桌沿)
    桌沿前板    y = 662 ~ 800
    学生脚底     y = 676         (0.845 * 800，与立绘 baseY 对齐)
  桌子在前，学生脚底以上 40 个单位（≈ 立绘高度的 6%）被桌沿遮住，
  比例刚好是「半身立绘坐在课桌后」的观感。

  桌面上的两件小道具（课本 / 笔筒）放在左右两端，
  避开 0.25 / 0.5 / 0.75 三个站位，不与人物打架。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 800" width="2400" height="800"
     preserveAspectRatio="none" fill="none" role="img" aria-labelledby="cd-title cd-desc">
  <title id="cd-title">课桌前沿层</title>
  <desc id="cd-desc">一排浅木色课桌，桌面上放着两本课本和一个笔筒，桌前板有竖向接缝。</desc>

  <defs>
    <!-- 桌面板：浅橡木，上下略有色差 -->
    <linearGradient id="cd-top" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#d9c3a1"/>
      <stop offset=".55" stop-color="#cbb189"/>
      <stop offset="1" stop-color="#b99c72"/>
    </linearGradient>

    <!-- 前挡板：比桌面暗一档，做出厚度 -->
    <linearGradient id="cd-front" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#bfa17a"/>
      <stop offset=".45" stop-color="#b0926c"/>
      <stop offset="1" stop-color="#a1845f"/>
    </linearGradient>

    <!-- 竖向木纹 -->
    <linearGradient id="cd-grain" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8c7150" stop-opacity="0"/>
      <stop offset=".5" stop-color="#8c7150" stop-opacity=".16"/>
      <stop offset="1" stop-color="#8c7150" stop-opacity="0"/>
    </linearGradient>

    <filter id="cd-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- 桌面道具（先画，之后被桌沿挡住底部 → 看起来立在桌面上） -->
  <g>
    <!-- 左端：两本叠起的课本。原来封面被桌面遮掉后只剩大片书页白，
         在小尺寸下会变成一个「空白方框」，所以改成深色封面 + 细书口。 -->
    <g>
      <rect x="105" y="600" width="168" height="48" rx="6" fill="#a8705e"/>
      <rect x="105" y="600" width="168" height="9" rx="4" fill="#bd8a76"/>
      <rect x="105" y="638" width="168" height="9" rx="2" fill="#efe6d3" opacity=".92"/>
      <rect x="117" y="562" width="144" height="42" rx="6" fill="#6f7e72"/>
      <rect x="117" y="562" width="144" height="8" rx="4" fill="#84957f"/>
      <rect x="117" y="594" width="144" height="9" rx="2" fill="#efe6d3" opacity=".88"/>
    </g>

    <!-- 右端：笔筒 -->
    <g>
      <path d="M2136 662L2146 596H2210L2220 662Z" fill="#8d7a62"/>
      <path d="M2136 662L2146 596H2160L2152 662Z" fill="#a08c70" opacity=".75"/>
      <rect x="2166" y="548" width="10" height="62" rx="4" fill="#c9a978" transform="rotate(6 2171 582)"/>
      <rect x="2184" y="536" width="10" height="74" rx="4" fill="#8fa39a" transform="rotate(-4 2189 574)"/>
      <rect x="2199" y="552" width="10" height="58" rx="4" fill="#c08d7e" transform="rotate(9 2204 582)"/>
    </g>
  </g>

  <!-- 桌面（可见的一条） -->
  <rect y="636" width="2400" height="26" fill="url(#cd-top)"/>
  <rect y="636" width="2400" height="3" fill="#e9d8ba" opacity=".85"/>
  <rect y="659" width="2400" height="3" fill="#8e7351" opacity=".5"/>

  <!-- 前挡板 -->
  <rect y="662" width="2400" height="138" fill="url(#cd-front)"/>
  <!-- 桌与桌之间的竖向接缝 -->
  <g stroke="#876d4c" stroke-opacity=".42" stroke-width="2">
    <path d="M600 662v138"/>
    <path d="M1200 662v138"/>
    <path d="M1800 662v138"/>
  </g>
  <g stroke="#d6bd97" stroke-opacity=".3" stroke-width="1.4">
    <path d="M605 662v138"/>
    <path d="M1205 662v138"/>
    <path d="M1805 662v138"/>
  </g>
  <!-- 木纹 -->
  <g stroke="#7f6746" stroke-opacity=".12" stroke-width="2" stroke-linecap="round">
    <path d="M60 702c180-10 360 10 540 0s360-12 540-4 360 14 540 6 360-14 660-6"/>
    <path d="M0 754c240-12 480 8 720 0s480-10 720 2 480 12 720 4"/>
  </g>
  <rect x="90" y="662" width="330" height="138" fill="url(#cd-grain)"/>
  <rect x="870" y="662" width="300" height="138" fill="url(#cd-grain)"/>
  <rect x="1620" y="662" width="315" height="138" fill="url(#cd-grain)"/>

  <!-- 桌前板下缘的落影 -->
  <rect y="784" width="2400" height="16" fill="#6d5a3f" opacity=".18" filter="url(#cd-soft)"/>
</svg>
