<?xml version="1.0" encoding="UTF-8"?>
<!--
  讲台求生 · 2D 教室背景层（backdrop）
  ------------------------------------------------------------------
  风格：与三张学生立绘同一套「哑光纸感 / 克制低饱和」语言，
        不是扁平 UI 色块，而是有材质、有光影的教室前墙。

  用法：作为 <img> 载入后用 drawImage(img, 0, 0, W, H) 铺满画布。
        根元素 preserveAspectRatio="none" 是有意为之 —— 画布是超宽比例
        （约 3:1），拉伸后地板线仍然落在 0.845H，与立绘脚底严格对齐。
        横向拉伸会让圆形略变椭圆，所以这里的圆形元素都尽量少用。

  坐标系：viewBox 0 0 1600 900
        地板线  y = 760  (= 0.8444 * 900，与立绘 baseY = 0.845H 对齐)
        黑板    y = 22 ~ 210
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     preserveAspectRatio="none" fill="none" role="img" aria-labelledby="cb-title cb-desc">
  <title id="cb-title">教室前墙 · 黑板与地板</title>
  <desc id="cb-desc">暖白纸感墙面，深绿哑光黑板带木框与粉笔槽，浅色橡木地板，顶部有一道柔和天光。</desc>

  <defs>
    <!-- 墙面：上暖下沉的纸色 -->
    <linearGradient id="cb-wall" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f5f0e6"/>
      <stop offset=".55" stop-color="#eee7d9"/>
      <stop offset="1" stop-color="#e4dccb"/>
    </linearGradient>

    <!-- 黑板框：木纹暖褐 -->
    <linearGradient id="cb-frame" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#cdb491"/>
      <stop offset=".5" stop-color="#bb9e78"/>
      <stop offset="1" stop-color="#a98b66"/>
    </linearGradient>

    <!-- 黑板面：哑光深绿，中心略亮 -->
    <radialGradient id="cb-board" cx="46%" cy="38%" r="78%">
      <stop stop-color="#396055"/>
      <stop offset=".62" stop-color="#2f4e44"/>
      <stop offset="1" stop-color="#27433b"/>
    </radialGradient>

    <!-- 黑板上沿的压暗 -->
    <linearGradient id="cb-board-top" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0d1a16" stop-opacity=".28"/>
      <stop offset="1" stop-color="#0d1a16" stop-opacity="0"/>
    </linearGradient>

    <!-- 粉笔槽 -->
    <linearGradient id="cb-tray" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#c3a87f"/>
      <stop offset="1" stop-color="#a98c65"/>
    </linearGradient>

    <!-- 地板 -->
    <linearGradient id="cb-floor" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ddd3bf"/>
      <stop offset="1" stop-color="#cdbfa4"/>
    </linearGradient>

    <!-- 墙脚在地面上的投影 -->
    <linearGradient id="cb-floorshadow" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7d6d51" stop-opacity=".22"/>
      <stop offset="1" stop-color="#7d6d51" stop-opacity="0"/>
    </linearGradient>

    <!-- 天光 -->
    <linearGradient id="cb-shaft" x1="0" y1="0" x2=".35" y2="1">
      <stop stop-color="#fffaf0" stop-opacity=".26"/>
      <stop offset="1" stop-color="#fffaf0" stop-opacity="0"/>
    </linearGradient>

    <!-- 暗角 -->
    <radialGradient id="cb-vignette" cx="50%" cy="44%" r="72%">
      <stop offset=".55" stop-color="#5d4f38" stop-opacity="0"/>
      <stop offset="1" stop-color="#5d4f38" stop-opacity=".16"/>
    </radialGradient>

    <!-- 纸颗粒：噪声映射成稀疏褐色斑点，不是灰洗 -->
    <filter id="cb-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 .42
                0 0 0 0 .36
                0 0 0 0 .28
                .18 0 0 0 0"/>
    </filter>

    <filter id="cb-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <filter id="cb-softer" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>

    <filter id="cb-chalk" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <!-- 墙 -->
  <rect width="1600" height="762" fill="url(#cb-wall)"/>
  <rect width="1600" height="762" filter="url(#cb-grain)" opacity=".5"/>

  <!-- 天光：从左上斜切进教室 -->
  <path d="M0 0H520L760 762H120Z" fill="url(#cb-shaft)"/>
  <path d="M0 0H520L760 762H120Z" fill="#fffdf6" opacity=".05" filter="url(#cb-softer)"/>

  <!-- 墙裙线（给墙面一点层次，不抢主体） -->
  <rect y="596" width="1600" height="4" fill="#d6cbb5" opacity=".85"/>
  <rect y="600" width="1600" height="2" fill="#c8bca4" opacity=".55"/>

  <!-- 黑板 -->
  <g>
    <!-- 板在墙上的落影 -->
    <rect x="266" y="30" width="1072" height="186" rx="12" fill="#6b5b42" opacity=".2" filter="url(#cb-soft)"/>
    <!-- 木框 -->
    <rect x="262" y="22" width="1076" height="188" rx="12" fill="url(#cb-frame)"/>
    <rect x="266" y="26" width="1068" height="180" rx="10" stroke="#8c7053" stroke-opacity=".5" stroke-width="1.6"/>
    <!-- 板面 -->
    <rect x="272" y="32" width="1056" height="166" rx="6" fill="url(#cb-board)"/>
    <!-- 擦不干净的粉笔灰 -->
    <ellipse cx="520" cy="96" rx="150" ry="44" fill="#e9f2ec" opacity=".05" filter="url(#cb-soft)"/>
    <ellipse cx="1120" cy="140" rx="118" ry="38" fill="#e9f2ec" opacity=".045" filter="url(#cb-soft)"/>
    <ellipse cx="820" cy="60" rx="90" ry="26" fill="#e9f2ec" opacity=".04" filter="url(#cb-soft)"/>
    <!-- 上沿压暗 -->
    <rect x="272" y="32" width="1056" height="18" rx="6" fill="url(#cb-board-top)"/>
    <!-- 残留板书：淡到几乎看不见，只提供「写过字」的质感 -->
    <g opacity=".14" stroke="#f2f6f1" stroke-width="3" stroke-linecap="round" filter="url(#cb-chalk)">
      <path d="M356 96h150M356 118h96M356 140h124"/>
      <path d="M604 92h118M604 114h72"/>
      <path d="M1044 100h138M1044 122h84"/>
    </g>
    <g opacity=".1" stroke="#e8f0ea" stroke-width="2.2" stroke-linecap="round">
      <path d="M356 164c40 10 84 10 126 0"/>
      <path d="M1044 156c46 12 92 12 138 0"/>
    </g>
    <!-- 粉笔槽 -->
    <rect x="262" y="210" width="1076" height="17" rx="5" fill="url(#cb-tray)"/>
    <rect x="262" y="210" width="1076" height="3" rx="1.5" fill="#dcc7a4" opacity=".8"/>
    <rect x="262" y="225" width="1076" height="2" rx="1" fill="#8e7452" opacity=".45"/>
    <!-- 粉笔 -->
    <rect x="432" y="214" width="28" height="8" rx="4" fill="#f6f2e7"/>
    <rect x="466" y="215" width="21" height="7" rx="3.5" fill="#e9c9c4"/>
    <rect x="492" y="214" width="15" height="8" rx="4" fill="#c9d7dc"/>
    <rect x="1174" y="214" width="31" height="8" rx="4" fill="#f2eee2"/>
    <!-- 黑板擦 -->
    <rect x="1232" y="211" width="44" height="12" rx="3" fill="#9b8870"/>
    <rect x="1232" y="211" width="44" height="5" rx="2.5" fill="#6f6252" opacity=".8"/>
  </g>

  <!-- 地板 -->
  <rect y="760" width="1600" height="140" fill="url(#cb-floor)"/>
  <rect y="760" width="1600" height="22" fill="url(#cb-floorshadow)"/>
  <!-- 地板缝 -->
  <g stroke="#bcaf92" stroke-opacity=".5" stroke-width="1.6">
    <path d="M0 806h1600"/>
    <path d="M0 856h1600"/>
  </g>
  <!-- 地面柔光 -->
  <ellipse cx="760" cy="872" rx="720" ry="46" fill="#f2e9d6" opacity=".26" filter="url(#cb-softer)"/>

  <!-- 暗角 -->
  <rect width="1600" height="900" fill="url(#cb-vignette)"/>
</svg>
