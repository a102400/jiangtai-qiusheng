<?xml version="1.0" encoding="UTF-8"?>
<!--
  讲台求生 · 2D 教室课桌层（desks）
  ------------------------------------------------------------------
  这一层画在「人物之后」，所以课桌前沿会遮住立绘最下面一截 ——
  立绘是半身裁切，原本的平底会显得像被切断，桌子一挡就自然变成
  「学生坐在桌后」。

  坐标系与 backdrop.svg 完全一致（viewBox 0 0 1600 900）：
    桌面可见条  y = 716 ~ 742   (学生身后 → 桌沿，斜向看过去只剩一条)
    桌沿前板    y = 742 ~ 900
    学生脚底     y = 760.5       (0.845 * 900，与立绘 baseY 对齐)
  因为桌子在前，学生脚底以上 44 个单位（≈ 立绘高度的 7%）被桌沿遮住，
  比例刚好是「半身立绘坐在课桌后」的观感。

  桌面上的两件小道具（课本 / 笔筒）放在左右两端，
  避开 0.25 / 0.5 / 0.75 三个站位，不与人物打架。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     preserveAspectRatio="none" fill="none" role="img" aria-labelledby="cd-title cd-desc">
  <title id="cd-title">课桌前沿层</title>
  <desc id="cd-desc">一排浅木色课桌，桌面上放着两本课本和一个笔筒，桌前板有竖向接缝。</desc>

  <defs>
    <!-- 桌面板：浅橡木，上下略有色差 -->
    <linearGradient id="cd-top" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#d9c3a1"/>
      <stop offset=".55" stop-color="#cbb189"/>
      <stop offset="1" stop-color="#b99c72"/>
    </linearGradient>

    <!-- 前挡板：比桌面暗一档，做出厚度 -->
    <linearGradient id="cd-front" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#bfa17a"/>
      <stop offset=".45" stop-color="#b0926c"/>
      <stop offset="1" stop-color="#a1845f"/>
    </linearGradient>

    <!-- 竖向木纹 -->
    <linearGradient id="cd-grain" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8c7150" stop-opacity="0"/>
      <stop offset=".5" stop-color="#8c7150" stop-opacity=".16"/>
      <stop offset="1" stop-color="#8c7150" stop-opacity="0"/>
    </linearGradient>

    <filter id="cd-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- 桌面道具（先画，之后被桌沿挡住底部 → 看起来立在桌面上） -->
  <g>
    <!-- 左端：两本叠起的课本 -->
    <g>
      <rect x="70" y="712" width="112" height="32" rx="4" fill="#a8705e"/>
      <rect x="70" y="712" width="112" height="7" rx="3" fill="#bd8a76"/>
      <rect x="74" y="716" width="104" height="24" rx="2" fill="#efe6d3" opacity=".9"/>
      <rect x="78" y="686" width="96" height="28" rx="4" fill="#6f7e72"/>
      <rect x="78" y="686" width="96" height="6" rx="3" fill="#84957f"/>
      <rect x="82" y="690" width="88" height="20" rx="2" fill="#efe6d3" opacity=".85"/>
    </g>

    <!-- 右端：笔筒 -->
    <g>
      <path d="M1424 744L1432 700H1476L1484 744Z" fill="#8d7a62"/>
      <path d="M1424 744L1432 700H1442L1436 744Z" fill="#a08c70" opacity=".75"/>
      <rect x="1444" y="666" width="7" height="42" rx="3" fill="#c9a978" transform="rotate(6 1448 690)"/>
      <rect x="1456" y="658" width="7" height="50" rx="3" fill="#8fa39a" transform="rotate(-4 1460 684)"/>
      <rect x="1466" y="670" width="7" height="38" rx="3" fill="#c08d7e" transform="rotate(9 1470 690)"/>
    </g>
  </g>

  <!-- 桌面（可见的一条） -->
  <rect y="716" width="1600" height="26" fill="url(#cd-top)"/>
  <rect y="716" width="1600" height="3" fill="#e9d8ba" opacity=".85"/>
  <rect y="739" width="1600" height="3" fill="#8e7351" opacity=".5"/>

  <!-- 前挡板 -->
  <rect y="742" width="1600" height="158" fill="url(#cd-front)"/>
  <!-- 桌与桌之间的竖向接缝 -->
  <g stroke="#876d4c" stroke-opacity=".42" stroke-width="2">
    <path d="M400 742v158"/>
    <path d="M800 742v158"/>
    <path d="M1200 742v158"/>
  </g>
  <g stroke="#d6bd97" stroke-opacity=".3" stroke-width="1.4">
    <path d="M404 742v158"/>
    <path d="M804 742v158"/>
    <path d="M1204 742v158"/>
  </g>
  <!-- 木纹 -->
  <g stroke="#7f6746" stroke-opacity=".12" stroke-width="2" stroke-linecap="round">
    <path d="M40 792c120-8 240 8 360 0s240-10 360-2 240 12 360 4 240-12 440-4"/>
    <path d="M0 838c160-10 320 6 480 0s320-8 480 2 320 10 480 2"/>
  </g>
  <rect x="60" y="742" width="220" height="158" fill="url(#cd-grain)"/>
  <rect x="580" y="742" width="200" height="158" fill="url(#cd-grain)"/>
  <rect x="1080" y="742" width="210" height="158" fill="url(#cd-grain)"/>

  <!-- 桌前板下缘的落影 -->
  <rect y="884" width="1600" height="16" fill="#6d5a3f" opacity=".18" filter="url(#cd-soft)"/>
</svg>
