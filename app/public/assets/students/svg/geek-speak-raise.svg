<svg data-character="geek" data-state="speak-raise" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 800" fill="none" role="img" aria-labelledby="m-title m-desc">
<title id="m-title">小霸 · 戴眼镜的男学生 · 举手发言</title>
<desc id="m-desc">黑色短发、金属框眼镜、原暖肤色的男学生，白橙色翻领短袖校服，举剪刀手。衣料采用柔和低饱和色彩与细微纸感。背景透明。</desc>
<defs>
<!-- Skin and hair use the preceding portrait's palette unchanged. -->
<radialGradient id="m-skin" cx="35%" cy="28%" r="83%">
<stop stop-color="#efceb2"/><stop offset=".34" stop-color="#dfb294"/><stop offset=".65" stop-color="#c9967b"/><stop offset=".85" stop-color="#b17e66"/><stop offset="1" stop-color="#8e6050"/>
</radialGradient>
<linearGradient id="m-neck" x1="20%" y1="0%" x2="83%" y2="100%">
<stop stop-color="#8c6151"/><stop offset=".32" stop-color="#b8886c"/><stop offset=".66" stop-color="#c79a7c"/><stop offset="1" stop-color="#a77960"/>
</linearGradient>
<radialGradient id="m-ear" cx="33%" cy="38%" r="80%">
<stop stop-color="#d9aa8e"/><stop offset=".62" stop-color="#b57f67"/><stop offset="1" stop-color="#895845"/>
</radialGradient>
<linearGradient id="m-hair" x1="10%" y1="0%" x2="82%" y2="100%">
