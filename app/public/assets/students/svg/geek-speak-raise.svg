</linearGradient>
<radialGradient id="m-hand" cx="30%" cy="20%" r="92%">
<stop stop-color="#e9c4a0"/><stop offset=".32" stop-color="#d9ad87"/><stop offset=".66" stop-color="#bf906c"/><stop offset="1" stop-color="#926348"/>
</radialGradient>
<linearGradient id="m-arm" x1="0%" y1="30%" x2="100%" y2="60%">
<stop stop-color="#a17b56"/><stop offset=".34" stop-color="#c6a071"/><stop offset=".63" stop-color="#d4b083"/><stop offset="1" stop-color="#9e7955"/>
</linearGradient>
<radialGradient id="m-cloth" cx="42%" cy="26%" r="88%">
<stop stop-color="#e9e6d9"/><stop offset=".4" stop-color="#dcded0"/><stop offset=".76" stop-color="#c0c9b8"/><stop offset="1" stop-color="#99aa97"/>
</radialGradient>
<linearGradient id="m-orange" x1="0%" y1="0%" x2="100%" y2="90%">
<stop stop-color="#d5ad80"/><stop offset=".35" stop-color="#c6966b"/><stop offset=".72" stop-color="#b38057"/><stop offset="1" stop-color="#98704f"/>
</linearGradient>
<linearGradient id="m-orange-r" x1="0%" y1="0%" x2="100%" y2="100%">
<stop stop-color="#cba47b"/><stop offset=".45" stop-color="#b78b64"/><stop offset="1" stop-color="#8f7153"/>
</linearGradient>
<linearGradient id="m-collar" x1="20%" y1="0%" x2="80%" y2="100%">
<stop stop-color="#ece9dc"/><stop offset=".5" stop-color="#dcdfce"/><stop offset="1" stop-color="#b7c4ae"/>
</linearGradient>
<radialGradient id="m-iris">
<stop stop-color="#675640"/><stop offset=".55" stop-color="#3d352a"/><stop offset="1" stop-color="#25251e"/>
</radialGradient>
<linearGradient id="m-metal" x1="0%" y1="0%" x2="100%" y2="100%">
<stop stop-color="#c6c4ac"/><stop offset=".45" stop-color="#929e8a"/><stop offset=".72" stop-color="#c3c5ae"/><stop offset="1" stop-color="#828f7f"/>
