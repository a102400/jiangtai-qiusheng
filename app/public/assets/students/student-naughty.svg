<!-- 归档件：用户提供的原始素材（黄色角色）。产品已改用 svg/ 下的九状态版本，
     本文件仅作原始出处留档，不再被任何代码引用。角色现映射为 drift。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 740" fill="none" role="img" aria-labelledby="y-title y-desc">
<title id="y-title">黄色校服角色 · 保色哑光版</title>
<desc id="y-desc">保持原黄色皮肤和绿色眼睛的圆润角色，穿低饱和白橙校服。服装带柔和水粉笔触与细微纸感。背景透明。</desc>
<defs>
