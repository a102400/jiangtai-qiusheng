<stop stop-color="#fbd66b"/><stop offset=".44" stop-color="#dfb030"/><stop offset=".8" stop-color="#b48321"/><stop offset="1" stop-color="#79591e"/>
</radialGradient>
<radialGradient id="y-sole" cx="35%" cy="25%" r="85%">
<stop stop-color="#b59a61"/><stop offset=".58" stop-color="#947a47"/><stop offset="1" stop-color="#62502f"/>
</radialGradient>
