<filter id="y-soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="y-wash" x="-50%" y="-70%" width="200%" height="240%"><feGaussianBlur stdDeviation="7"/></filter>
<filter id="y-paper" x="-3%" y="-3%" width="106%" height="106%" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" seed="26" result="noise"/>
<feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
<feComponentTransfer in="gray" result="grain"><feFuncA type="linear" slope=".12"/></feComponentTransfer>
<feComposite in="grain" in2="SourceGraphic" operator="in" result="masked"/>
<feBlend in="SourceGraphic" in2="masked" mode="soft-light"/>
</filter>
<filter id="y-dry" x="-15%" y="-20%" width="130%" height="140%">
<feTurbulence type="fractalNoise" baseFrequency=".12 .7" numOctaves="2" seed="14" result="brush"/>
<feColorMatrix in="brush" type="luminanceToAlpha" result="alpha"/>
<feComposite in="SourceGraphic" in2="alpha" operator="in"/>
</filter>
