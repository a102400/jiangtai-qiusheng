<radialGradient id="y-armR" cx="33%" cy="18%" r="91%">
<stop stop-color="#ffe078"/><stop offset=".44" stop-color="#e9bc37"/><stop offset=".8" stop-color="#bd8c24"/><stop offset="1" stop-color="#805b1c"/>
</radialGradient>
<radialGradient id="y-legL" cx="31%" cy="20%" r="88%">
<stop stop-color="#ffe782"/><stop offset=".43" stop-color="#edc33f"/><stop offset=".8" stop-color="#c39127"/><stop offset="1" stop-color="#886421"/>
</radialGradient>
