<stop stop-color="#fff3a0"/><stop offset=".27" stop-color="#ffe16a"/><stop offset=".58" stop-color="#eebe36"/><stop offset=".82" stop-color="#c48e23"/><stop offset="1" stop-color="#89601d"/>
</radialGradient>
<radialGradient id="y-head" cx="34%" cy="19%" r="87%">
<stop stop-color="#fff6ab"/><stop offset=".29" stop-color="#ffe674"/><stop offset=".63" stop-color="#edc13e"/><stop offset=".86" stop-color="#d19b28"/><stop offset="1" stop-color="#a6741f"/>
</radialGradient>
<radialGradient id="y-armL" cx="28%" cy="20%" r="90%">
<stop stop-color="#ffe989"/><stop offset=".42" stop-color="#f4cb43"/><stop offset=".77" stop-color="#d0a02a"/><stop offset="1" stop-color="#946b20"/>
