<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>讲台求生 · 方向B 巨型数字</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5/900.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5/400.css">
<style>
  *{margin:0;box-sizing:border-box}
  body{font-family:"Noto Sans SC",sans-serif;background:#0E1116;color:#EDEDED;-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{width:390px;min-height:100vh;padding:32px 24px;display:flex;flex-direction:column}
  .brand{font-weight:900;font-size:26px;letter-spacing:3px}
  .sub{font-size:13px;color:#9aa0a6;margin-top:10px;max-width:250px;line-height:1.6}
  .hero{margin-top:46px;text-align:center}
  .big{font-family:"Noto Sans SC";font-weight:900;font-size:150px;line-height:.86;color:#FFB000;letter-spacing:-4px}
  .big .cur{font-size:66px;vertical-align:top;margin-right:4px}
  .strike{font-size:19px;color:#6b7178;text-decoration:line-through;margin-top:4px}
  .line{font-size:14px;color:#cfd3d8;margin-top:20px;line-height:1.6}
  .img{margin:30px auto 0;width:100%;height:120px;border-radius:14px;background:#1c2230}
  .foot{margin-top:auto;font-size:11px;color:#6b7178;line-height:1.6;padding-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">讲台求生</div>
  <div class="sub">别人的微格教室 28.5 万一套，我们零硬件。</div>
  <div class="hero">
    <div class="big"><span class="cur">¥</span>0</div>
    <div class="strike">¥285,000 / 套</div>
    <div class="line">浏览器即开即练 · 本地转写数据不出本机</div>
    <div class="img" data-img="AI 学生拆台场景占位"></div>
  </div>
  <div class="foot">3098 名师范生已被同类研究验证有效（18 国系统综述）· 29 名师范生试讲对话质量接近成熟教师</div>
</div>
</body>
</html>
