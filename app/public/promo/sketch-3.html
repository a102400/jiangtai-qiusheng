<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>讲台求生 · 方向C 斜切拆台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/zcool-kuaile@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5/400.css">
<style>
  *{margin:0;box-sizing:border-box}
  body{font-family:"Noto Sans SC",sans-serif;background:#11151C;color:#fff;-webkit-font-smoothing:antialiased;min-height:100vh;overflow:hidden}
  .wrap{position:relative;width:390px;min-height:100vh}
  .band{position:absolute;top:-50px;left:-50px;right:-50px;height:300px;background:#FF6B35;transform:rotate(-9deg);transform-origin:left center}
  .brand{position:absolute;top:40px;left:26px;font-family:"ZCOOL KuaiLe";font-size:32px;color:#11151C;z-index:2;letter-spacing:2px}
  .bubble{position:absolute;top:158px;left:24px;right:24px;background:#fff;color:#11151C;border-radius:20px;padding:18px 20px;font-size:18px;line-height:1.55;z-index:3;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .bubble b{display:block;margin-top:8px;color:#FF6B35;font-size:14px}
  .img{position:absolute;bottom:128px;left:26px;width:120px;height:120px;border-radius:50%;background:#2a2f38;z-index:3}
  .stu{position:absolute;bottom:128px;left:162px;font-size:13px;color:#cfd3d8;z-index:3;line-height:1.7}
  .foot{position:absolute;bottom:34px;left:26px;font-size:11px;color:#9aa0a6;z-index:3}
</style>
</head>
<body>
<div class="wrap">
  <div class="band"></div>
  <div class="brand">讲台求生</div>
  <div class="bubble">「老师，这道题——<br>您是不是讲错了？」<b>调皮学生 · 当场拆台</b></div>
  <div class="img" data-img="AI 学生头像占位"></div>
  <div class="stu">调皮 / 学霸 / 走神<br>多人格 · temperature 0.8–1.0</div>
  <div class="foot">台上的你，正被 AI 学生当场顶嘴</div>
</div>
</body>
</html>
